name: Build & Publish Android APK Automatically

on:
  push:
    branches: ['main']
    paths-ignore:
      - 'releases/**'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build-and-publish-apk:
    name: Compilar e Publicar Machenike-Hub-Android.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies & Capacitor Android
        run: |
          npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build production web assets
        env:
          VITE_BASE_PATH: ./
        run: npm run build

      - name: Initialize and sync Android project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compile signed installable Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare APK file in releases/
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/Machenike-Hub-Android.apk

      - name: Commit Machenike-Hub-Android.apk to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/Machenike-Hub-Android.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore(android): atualiza Machenike-Hub-Android.apk [skip ci]"
            git push
          fi

      - name: Publish APK to Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Machenike Hub — Android APK (Última Versão)
          body: |
            Instale diretamente no celular Android baixando o arquivo **`Machenike-Hub-Android.apk`** abaixo.

            Ou acesse instantaneamente pelo navegador (PC e Celular):
            https://ais-pre-5rynuauy3fg3fc6c3betgo-399234863864.us-west1.run.app
          make_latest: true
          files: releases/Machenike-Hub-Android.apk
