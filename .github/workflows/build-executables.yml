name: Build & Publish GitHub Release (PC & Mobile)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versão da Release (ex.: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & Electron packager
        run: |
          npm install
          npm install --no-save electron electron-builder

      - name: Build web assets for Desktop
        env:
          VITE_BASE_PATH: ./
        run: npm run build

      - name: Package executable
        run: npx electron-builder --config electron-builder.json --publish never

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies & Capacitor Android
        run: |
          npm install
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web assets for Android
        env:
          VITE_BASE_PATH: ./
        run: npm run build

      - name: Sync Capacitor Android project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compile Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename Android APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Machenike-Hub-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Machenike-Hub-Android.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop, build-android]
    if: always() && (needs.build-desktop.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine release tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag || 'v1.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Machenike Hub ${{ steps.meta.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/*
            installers/windows/Instalar-Machenike-Hub.bat
            installers/macos/Instalar-Machenike-Hub.command
            installers/linux/instalar-machenike-hub.sh
